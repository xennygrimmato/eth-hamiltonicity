<g fill="#000">
<text x="20" y="35">Q: can prices prove</text><text x="20" y="55">rho &gt;= 1/2 on Delta_3?</text>
<text x="20" y="85">Step 1: LP over ALL</text><text x="20" y="105">metrics says: rho = 1.</text>
<text x="20" y="130">"No trade at all!"</text>
<text x="112" y="262" font-size="12">(it isn't CAT(0))</text>

<text x="267" y="35">Geodesics are unique,</text><text x="267" y="55">so every hub collapses</text>
<text x="267" y="75">into one point.</text>
<text x="267" y="110">Dead end #1.</text>
<text x="330" y="170" font-size="12">delta = 0</text>

<text x="514" y="35">Flat case: send legs</text><text x="514" y="55">to infinity, Euclidean.</text>
<text x="514" y="80">rho &gt;= 1/sqrt3 = 0.577</text><text x="514" y="100">on Delta_3. And the</text>
<text x="514" y="120">crossing gets EXACTLY</text><text x="514" y="140">App. B's 1/sqrt2.</text>

<text x="761" y="35">Contracting case:</text><text x="761" y="55">nobody knows which</text>
<text x="761" y="75">case we're in.</text>
<text x="761" y="110">So: "proved, assuming</text><text x="761" y="130">the universe is flat."</text>
<text x="761" y="160" font-size="12">(physicists do it all the time)</text>
</g>
