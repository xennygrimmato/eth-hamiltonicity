<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif" font-size="16">
<title>Flat triangle versus tripod: perimeter 6 in both, shared-label price 3 versus 8/3</title>
<rect width="960" height="470" fill="#fff"/>
<line x1="480" y1="20" x2="480" y2="450" stroke="#000" stroke-width="1" stroke-dasharray="3 6"/>

<!-- LEFT: flat triangle, side 2 -->
<text x="240" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">Flat triangle</text>
<g fill="none" stroke="#000">
  <path d="M240 78 L100 320 L380 320 Z" stroke-width="2.5"/>
  <circle cx="240" cy="239.2" r="80.8" stroke-width="1.2" stroke-dasharray="5 5"/>
</g>
<g fill="#000">
  <circle cx="240" cy="78" r="6"/><circle cx="100" cy="320" r="6"/><circle cx="380" cy="320" r="6"/>
  <circle cx="240" cy="320" r="3.5"/><circle cx="170" cy="199" r="3.5"/><circle cx="310" cy="199" r="3.5"/>
  <text x="240" y="64" text-anchor="middle">C (output)</text>
  <text x="84" y="343" text-anchor="middle">A</text>
  <text x="396" y="343" text-anchor="middle">B</text>
  <text x="194" y="140" text-anchor="end">1</text>
  <text x="122" y="262" text-anchor="end">1</text>
  <text x="286" y="140">1</text>
  <text x="358" y="262">1</text>
  <text x="170" y="341" text-anchor="middle">1</text>
  <text x="310" y="341" text-anchor="middle">1</text>
  <text x="240" y="341" text-anchor="middle" font-style="italic">j</text>
  <text x="150" y="203" text-anchor="end" font-style="italic">i</text>
  <text x="330" y="203" font-style="italic">k</text>
  <text x="240" y="380" text-anchor="middle">three wires, each of length 2: perimeter 6</text>
  <text x="240" y="404" text-anchor="middle">shared label = half the perimeter = 1 + 1 + 1 = 3</text>
  <text x="240" y="438" text-anchor="middle" font-size="20" font-weight="bold">6 / 3 = 2</text>
</g>

<!-- RIGHT: tripod, unit arms -->
<text x="720" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">Tripod</text>
<g fill="none" stroke="#000" stroke-width="2.5">
  <path d="M720 225 L720 78 M720 225 L593 298.5 M720 225 L847 298.5"/>
</g>
<g fill="#000">
  <circle cx="720" cy="78" r="6"/><circle cx="593" cy="298.5" r="6"/><circle cx="847" cy="298.5" r="6"/>
  <circle cx="720" cy="225" r="4"/>
  <text x="720" y="64" text-anchor="middle">C (output)</text>
  <text x="577" y="322" text-anchor="middle">A</text>
  <text x="863" y="322" text-anchor="middle">B</text>
  <text x="734" y="244">O</text>
  <text x="732" y="155">1</text>
  <text x="648" y="250" text-anchor="end">1</text>
  <text x="792" y="250">1</text>
  <text x="720" y="356" text-anchor="middle">tip to tip through O is 1 + 1 = 2: perimeter 6</text>
  <text x="720" y="380" text-anchor="middle">broadcasting a label from O would cost 1 + 1 + 1 = 3</text>
  <text x="720" y="404" text-anchor="middle">shared label = 3 − 1/(1 + 1 + 1) = 8/3</text>
  <text x="720" y="438" text-anchor="middle" font-size="20" font-weight="bold">6 / (8/3) = 9/4</text>
</g>
</svg>
