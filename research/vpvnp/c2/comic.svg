<g fill="#000" font-size="15">
<text x="22" y="40">PAPER: "we have not worked</text>
<text x="22" y="58">out what our bound gives</text>
<text x="22" y="76">for PIT." ME: on it.</text>
<text x="22" y="110" font-size="13">(searches arXiv, ECCC, blogs:</text>
<text x="22" y="126" font-size="13">nobody else has, yet. 3 news</text>
<text x="22" y="142" font-size="13">sites, one rival VP≠VNP.)</text>

<text x="270" y="40">Kabanets-Impagliazzo +</text>
<text x="270" y="58">Newton iteration gives a</text>
<text x="270" y="76">hitting set of size</text>
<text x="268" y="120" font-size="17">2^2^(10763·(log s)^¾)</text>
<text x="270" y="160" font-size="13">"beats brute force once</text>
<text x="270" y="176" font-size="13">log s &gt; 3·10^16."</text>

<text x="518" y="40">SMALL CHARACTERISTIC:</text>
<text x="518" y="58">root extraction hands back</text>
<text x="518" y="76">PERM^(p^k), not PERM.</text>
<text x="518" y="112" font-size="13">"Can you take p-th roots</text>
<text x="518" y="128" font-size="13">of circuits?" "Open since</text>
<text x="518" y="144" font-size="13">Andrews 2020." (shrug)</text>
<text x="518" y="176" font-size="13">Workaround: individual degree &lt; p.</text>

<text x="768" y="40">Also: dc(PERM) is</text>
<text x="768" y="58">quasi-polynomial! For</text>
<text x="768" y="76">all m ≥ m0 ...</text>
<text x="768" y="96" font-size="13">... and m0 is ineffective.</text>
<text x="856" y="142" font-size="14">BEST KNOWN</text>
<text x="856" y="162" font-size="14">AT m=10: m²</text>
</g>
</svg>
