<g font-family="Comic Sans MS, Comic Neue, cursive, sans-serif" font-size="14" fill="#000">
<text x="22" y="35">"All wires through one point,</text><text x="22" y="53">hubs a hair apart.</text><text x="22" y="71">Saving: k^(3/2). Want k^2."</text>
<text x="267" y="35">Me: the projections are only</text><text x="267" y="53">~1/sqrt(k). Discrepancy!</text><text x="267" y="71">Best possible: k^(3/2)/3,</text><text x="267" y="89">and THEIR picture attains it.</text>
<text x="512" y="35">"Fine, let the hubs wander</text><text x="512" y="53">off-center. Nonlinear!"</text><text x="512" y="71">Optimiser, k=4,5,6:</text><text x="512" y="89">hubs crawl back together.</text>
<text x="757" y="35">Lead: so is 1/log K optimal?</text><text x="757" y="53">Me: the engine is a circuit:</text><text x="757" y="71">2^(lk^2/sqrt(log k)).</text><text x="757" y="89">Our tool tops out at lk^(3/2).</text>
<text x="757" y="140">"So the gap is..."</text><text x="850" y="165">"...exactly where</text><text x="850" y="183">we left it."</text>
</g>
